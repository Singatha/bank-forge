spring:
  application:
    name: bankcore
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:bankcore}
    username: ${POSTGRES_USER:bankcore}
    password: ${POSTGRES_PASSWORD:bankcore-local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      repositories:
        enabled: false

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=bankcore requestId=%X{requestId:-} correlationId=%X{correlationId:-} logger=%logger{36} message=%msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      validate-group-membership: false
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,kafka
  health:
    redis:
      enabled: ${bankcore.rate-limiting.enabled:false}
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

bankcore:
  security:
    issuer: ${JWT_ISSUER:bankcore}
    jwt-secret: ${JWT_SECRET:local-development-only-bankcore-jwt-secret-change-before-production-2026}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
  features:
    development-funding-enabled: ${DEVELOPMENT_FUNDING_ENABLED:false}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:false}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:bankcore:rate-limit}
    authentication:
      limit: ${AUTH_RATE_LIMIT:10}
      window: ${AUTH_RATE_WINDOW:1m}
    transfers:
      limit: ${TRANSFER_RATE_LIMIT:20}
      window: ${TRANSFER_RATE_WINDOW:1m}
  messaging:
    enabled: ${KAFKA_ENABLED:false}
    transfer-topic: ${TRANSFER_TOPIC:bankcore.transfer.events.v1}
    dead-letter-topic: ${TRANSFER_DLT_TOPIC:bankcore.transfer.events.v1.dlt}
    notification-consumer-group: ${NOTIFICATION_CONSUMER_GROUP:bankcore-notifications-v1}
    publisher-batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-publish-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    publish-timeout: ${OUTBOX_PUBLISH_TIMEOUT:5s}
    retry-delay: ${OUTBOX_RETRY_DELAY:5s}
    processing-timeout: ${OUTBOX_PROCESSING_TIMEOUT:1m}
    publisher-fixed-delay: ${OUTBOX_PUBLISHER_DELAY:1s}
    publisher-initial-delay: ${OUTBOX_PUBLISHER_INITIAL_DELAY:5s}

